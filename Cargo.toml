[package]
name = "radioman"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rustfft = "6"
stream-descriptors = { git = "https://github.com/FuturePresentLabs/unibus.git", rev = "d7aaa980f8963209ade088b598b82688a3c158fd" }
mlua = { version = "0.12", optional = true, features = ["lua54", "vendored", "serialize"] }
dcp = { git = "https://github.com/FuturePresentLabs/dcp.git", rev = "d3a1335" }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tiny_http = "0.12"
subtle = "2"
adsb_deku = { git = "https://github.com/rsadsb/adsb_deku.git", rev = "e2bdf1e08d1ef1a8dbdea25f415cbd50170de60e" }
rsadsb_common = { git = "https://github.com/rsadsb/adsb_deku.git", rev = "e2bdf1e08d1ef1a8dbdea25f415cbd50170de60e" }
num-complex = "0.4"
libdump1090_rs = { git = "https://github.com/rsadsb/dump1090_rs.git", rev = "94a0e4d74f816bdff996f22cd56c5d97ee010368" }
unibus = { path = "../unibus-integration/crates/unibus" }

[dev-dependencies]
tempfile = "3"
hex = "0.4"

[features]
lua = ["dep:mlua"]
