[package]
name = "radioman"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
rf-gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rustfft = "6"
stream-descriptors = { git = "https://github.com/FuturePresentLabs/unibus.git", rev = "dae96d7e9873b5d8e830f444203ecce72467e6cf" }
dcp = { git = "https://github.com/FuturePresentLabs/dcp.git", rev = "d3a1335" }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tiny_http = "0.12"
subtle = "2"
wgpu = { version = "22", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"
